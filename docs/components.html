<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyroxCSS Full Documentation</title>
    <link rel="stylesheet" href="../dist/css/zyroxcss.css">
    <style>
        body { background-color: var(--bg-color, #f9fafb); }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; background: white; padding: 2rem; border-right: 1px solid var(--border-color, #e5e7eb); overflow-y: auto; }
        .main-content { margin-left: 250px; padding: 2rem; }
        .card { margin-bottom: 2rem; }
        .example-box { padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 1rem; background: white; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>ZyroxCSS</h2>
        <nav>
            <a href="#skeleton" class="nav-link">Skeleton</a><br>
            <a href="#toast" class="nav-link">Toast</a><br>
            <a href="#buttons" class="nav-link">Buttons</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Komponen ZyroxCSS</h1>

        <section id="skeleton" class="card">
            <div class="card-body">
                <h3>Skeleton Loader</h3>
                <p>Placeholder untuk konten yang sedang dimuat.</p>
                <div class="example-box">
                    <div class="skeleton" style="width: 100%; height: 20px;"></div>
                    <div class="skeleton" style="width: 50%; height: 20px;"></div>
                </div>
            </div>
        </section>

        <section id="toast" class="card">
            <div class="card-body">
                <h3>Toast Notifications</h3>
                <p>Notifikasi interaktif dengan posisi yang dapat diatur.</p>
                <div class="example-box">
                    <button class="btn btn--primary" onclick="zyroxCSS.showToast('Data tersimpan!', 'success', 3000, 'top-right')">Top Right</button>
                    <button class="btn btn--secondary" onclick="zyroxCSS.showToast('Peringatan!', 'warning', 3000, 'center')">Center</button>
                </div>
            </div>
        </section>

        <section id="buttons" class="card">
            <div class="card-body">
                <h3>Buttons</h3>
                <div class="example-box">
                    <button class="btn btn--primary">Primary</button>
                    <button class="btn btn--outline">Outline</button>
                </div>
            </div>
        </section>
    </main>
    <script src="../dist/js/zyroxcss.js"></script>
</body>
</html>
